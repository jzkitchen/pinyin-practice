<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6095C4">
  <meta name="description" content="普通話拼音練習的家長管理。">
  <title>家長管理 — 普通話拼音練習</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <p class="eyebrow">家長</p>
    <h1>管理詞組與字詞</h1>
    <p><a href="index.html">回到練習</a></p>
  </header>
  <main>
    <p id="status" class="status" role="status"></p>
    <section id="gate" class="card login-card">
      <h2>請輸入管理密碼</h2>
      <p class="hint">密碼交給 Firebase 核對，不會寫進這個網頁。</p>
      <p class="hint">家長帳號：<span id="parent-email"></span></p>
      <p id="gate-unconfigured" class="hint" hidden>雲端尚未設定，暫時不能進入家長管理。</p>
      <form id="login-form">
        <label for="password">密碼</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <div class="actions">
          <button type="submit" id="login-button" disabled>進入</button>
        </div>
      </form>
    </section>
    <div id="admin-app" hidden></div>
  </main>
  <footer class="site-footer">
    <p>版本 v1 · <a href="index.html">回到練習</a></p>
  </footer>
  <script src="js/config.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/pinyin-tables.js"></script>
  <script src="js/grade.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
